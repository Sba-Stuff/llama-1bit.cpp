name: Build Windows EXE (1-bit)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup CMake
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # 3. Configure project (PowerShell safe)
    - name: Configure CMake
      run: cmake -B build -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TESTS=OFF

    # 4. Build Release
    - name: Build project
      run: cmake --build build --config Release

    # 5. Upload EXE artifacts
    - name: Upload built EXE
      uses: actions/upload-artifact@v4
      with:
        name: llama-1bit-windows
        path: build/bin/*.exe
