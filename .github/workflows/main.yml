name: Build all LLaMA Windows binaries
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSYS2 / MinGW
        uses: msys2/setup-msys2@v3
        with:
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure and build all binaries
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build . --config Release -j 4

      - name: Collect all executables
        shell: bash
        run: |
          mkdir -p artifacts
          # Find all .exe files in the build tree and copy them to artifacts/
          find . -type f -iname "*.exe" -exec cp {} artifacts/ \;
          ls -lah artifacts

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-binaries
          path: artifacts/
