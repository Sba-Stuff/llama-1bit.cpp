name: Build Windows Full Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # 1. Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup CMake
    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # 3. Configure CMake to build all required binaries
    - name: Configure CMake
      run: cmake -B build -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

    # 4. Build all binaries
    - name: Build project
      run: cmake --build build --config Release

    # 5. Upload all built executables
    - name: Upload EXE binaries
      uses: actions/upload-artifact@v4
      with:
        name: llama-windows-full
        path: build/Release/*.exe
